name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests -v --cov=operations_reconciliation --cov-report=term-missing --cov-fail-under=100
      - name: Run Ruff
        run: python -m ruff check src tests
